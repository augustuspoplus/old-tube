<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6241d" />
      <stop offset="100%" stop-color="#9e0d0a" />
    </linearGradient>
    <linearGradient id="ytGloss" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <clipPath id="tvClip">
      <path d="M 87,90 C 166,78 346,78 425,90 C 468,94 474,129 476,159 C 484,206 484,306 476,353 C 474,383 468,418 425,422 C 346,434 166,434 87,422 C 44,418 38,383 36,353 C 28,306 28,206 36,159 C 38,129 44,94 87,90 Z" />
    </clipPath>
  </defs>

  <!-- Drop Shadow -->
  <path d="M 87,100 C 166,88 346,88 425,100 C 468,104 474,139 476,169 C 484,216 484,316 476,363 C 474,393 468,428 425,432 C 346,444 166,444 87,432 C 44,428 38,393 36,363 C 28,316 28,216 36,169 C 38,139 44,104 87,100 Z" fill="#000000" fill-opacity="0.31" />

  <!-- Main Classic YouTube Red Body -->
  <path d="M 87,90 C 166,78 346,78 425,90 C 468,94 474,129 476,159 C 484,206 484,306 476,353 C 474,383 468,418 425,422 C 346,434 166,434 87,422 C 44,418 38,383 36,353 C 28,306 28,206 36,159 C 38,129 44,94 87,90 Z" fill="url(#ytRed)" stroke="#ffbe9e" stroke-opacity="0.22" stroke-width="2.5" />

  <!-- Diagonal Gloss Sheen -->
  <g clip-path="url(#tvClip)">
    <polygon points="0,0 440,0 240,440 0,440" fill="url(#ytGloss)" />
  </g>

  <!-- Recessed Pixel Shadows -->
  <g fill="#550000" fill-opacity="0.43">
    <rect x="148" y="150" width="52" height="52" />
    <rect x="312" y="150" width="52" height="52" />
    <rect x="184" y="280" width="144" height="38" />
    <rect x="146" y="318" width="38" height="38" />
    <rect x="328" y="318" width="38" height="38" />
  </g>

  <!-- White Pixel Sad Face :( -->
  <g fill="#f6f6f6">
    <!-- Eyes -->
    <rect x="148" y="156" width="52" height="52" />
    <rect x="312" y="156" width="52" height="52" />
    <!-- Stepped Frown -->
    <rect x="184" y="286" width="144" height="38" />
    <rect x="146" y="324" width="38" height="38" />
    <rect x="328" y="324" width="38" height="38" />
  </g>
</svg>
