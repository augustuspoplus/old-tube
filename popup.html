<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #ff0033;
      --accent-hover: #cc0029;
      --border: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 310px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge.off {
      background: #333;
      color: var(--muted);
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .year-row {
      display: flex;
      gap: 8px;
    }
    select {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    .presets-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .preset-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 0;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover {
      border-color: var(--accent);
    }
    .preset-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 16px;
      cursor: pointer;
    }
    .checkbox-row input {
      cursor: pointer;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: #2b2b2b;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #3a3a3a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⏳ YT Time Machine</div>
    <span id="status-badge" class="badge off">OFF</span>
  </div>

  <div class="control-group">
    <label for="year-select">Select Target Year (2005 – Present)</label>
    <div class="year-row">
      <select id="year-select"></select>
    </div>
  </div>

  <div class="presets-label">Quick Nostalgia Years</div>
  <div class="presets" id="presets-container">
    <button class="preset-btn" data-year="2008">2008</button>
    <button class="preset-btn" data-year="2010">2010</button>
    <button class="preset-btn" data-year="2012">2012</button>
    <button class="preset-btn" data-year="2013">2013</button>
    <button class="preset-btn" data-year="2014">2014</button>
    <button class="preset-btn" data-year="2015">2015</button>
    <button class="preset-btn" data-year="2016">2016</button>
    <button class="preset-btn" data-year="2018">2018</button>
  </div>

  <label class="checkbox-row">
    <input type="checkbox" id="strict-checkbox" checked />
    <span>Strict Filter (hide Shorts & stray videos)</span>
  </label>

  <div class="actions">
    <button id="apply-btn" class="btn btn-primary">Apply Year</button>
    <button id="clear-btn" class="btn btn-secondary">Clear Filter</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
