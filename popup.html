<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --card: #222222;
      --card-hover: #2c2c2c;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --accent: #ff0033;
      --accent-hover: #e0002d;
      --border: #2e2e2e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 345px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .badge.off {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* Active Selected Years Box */
    .selected-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 12px;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .selected-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .clear-inline {
      background: none;
      border: none;
      color: #ff5566;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .clear-inline:hover {
      text-decoration: underline;
    }
    .selected-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .empty-hint {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }
    .year-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .year-pill:hover {
      background: var(--accent-hover);
    }
    .year-pill span {
      opacity: 0.85;
      font-size: 12px;
    }

    /* Section Labels */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-label small {
      text-transform: none;
      font-weight: 400;
      letter-spacing: 0;
    }

    /* Multi-Year Grid */
    .years-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 12px;
      max-height: 168px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .year-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 0;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      text-align: center;
    }
    .year-btn:hover {
      background: var(--card-hover);
      border-color: #555;
    }
    .year-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(255, 0, 51, 0.35);
    }

    /* Range Row */
    .range-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--surface);
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .range-row span {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
    }
    .range-row select {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 6px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .range-add-btn {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .range-add-btn:hover {
      border-color: var(--accent);
    }

    /* Settings Toggles */
    .toggles-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-title {
      font-size: 12.5px;
      font-weight: 600;
    }
    .toggle-sub {
      font-size: 11px;
      color: var(--muted);
    }
    .toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Footer Buttons */
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⏳ old-tube</div>
    <span id="status-badge" class="badge off">OFF</span>
  </div>

  <div class="selected-box">
    <div class="selected-header">
      <span id="selected-count-label">Selected Years (0)</span>
      <button type="button" id="clear-inline-btn" class="clear-inline">Clear all</button>
    </div>
    <div class="selected-pills" id="selected-pills">
      <span class="empty-hint">Click any years below to auto-apply</span>
    </div>
  </div>

  <div class="section-label">
    <span>Select Years (Auto-Applies)</span>
    <small>Shift+Click for range</small>
  </div>
  <div class="years-grid" id="years-grid"></div>

  <div class="range-row">
    <span>Span:</span>
    <select id="range-from"></select>
    <span>to</span>
    <select id="range-to"></select>
    <button type="button" id="range-add-btn" class="range-add-btn">+ Toggle</button>
  </div>

  <div class="toggles-group">
    <label class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Video Sidebar Feed Bar</span>
        <span class="toggle-sub">Show quick year selector at top of video sidebar</span>
      </div>
      <input type="checkbox" id="sidebar-checkbox" checked />
    </label>

    <label class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Strict Filter Mode</span>
        <span class="toggle-sub">Hide Shorts shelves & stray out-of-year videos</span>
      </div>
      <input type="checkbox" id="strict-checkbox" checked />
    </label>
  </div>

  <div class="actions">
    <button type="button" id="clear-btn" class="btn btn-secondary">Reset All Years</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
