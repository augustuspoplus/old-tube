<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --card: #222222;
      --card-hover: #2c2c2c;
      --text: #f1f1f1;
      --muted: #9a9a9a;
      --accent: #ff0033;
      --accent-hover: #e0002d;
      --border: #2e2e2e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 335px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .title {
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .badge.off {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .section-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Unified Years Grid (2005 – 2026) */
    .years-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .year-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 0;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      text-align: center;
    }
    .year-btn:hover {
      background: var(--card-hover);
      border-color: #555;
    }
    .year-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(255, 0, 51, 0.35);
    }

    /* Settings Toggles */
    .toggles-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-title {
      font-size: 12.5px;
      font-weight: 600;
    }
    .toggle-sub {
      font-size: 11px;
      color: var(--muted);
    }
    .toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Footer Buttons */
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--card-hover);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⏳ old-tube</div>
    <span id="status-badge" class="badge off">OFF</span>
  </div>

  <div class="section-label">
    <span>Select Target Years (2005 – Present)</span>
  </div>
  <div class="years-grid" id="years-grid"></div>

  <div class="toggles-group">
    <label class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Video Sidebar Feed Bar</span>
        <span class="toggle-sub">Show quick year selector at top of video sidebar</span>
      </div>
      <input type="checkbox" id="sidebar-checkbox" checked />
    </label>

    <label class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Strict Filter Mode</span>
        <span class="toggle-sub">Hide Shorts shelves & stray out-of-year videos</span>
      </div>
      <input type="checkbox" id="strict-checkbox" checked />
    </label>

    <label class="toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Block Modern Annotations</span>
        <span class="toggle-sub">Hide end-screen cards, info popups & branding overlays</span>
      </div>
      <input type="checkbox" id="annotations-checkbox" checked />
    </label>
  </div>

  <div class="actions">
    <button type="button" id="apply-btn" class="btn btn-primary">Apply Year</button>
    <button type="button" id="clear-btn" class="btn btn-secondary">Clear Filter</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
